name: Update Masters Card Photo

on:
  push:
    paths:
      - '.github/workflows/patch-masters-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Masters image reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          matches = list(re.finditer(r'images/home-01\.png', s))
          if not matches:
              raise SystemExit('No home-01 image reference found')
          pos = matches[-1].start()
          s = s[:pos] + 'images/masters-card.jpg' + s[pos + len('images/home-01.png'):]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "TornadoesSynchroResources"
          git config user.email "jessicadancer83@gmail.com"
          git add index.html .github/workflows/patch-masters-photo.yml
          git rm .github/workflows/patch-masters-photo.yml
          git commit -m "Use new Masters group photo"
          git push
