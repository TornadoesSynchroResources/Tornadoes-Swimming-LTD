name: Update Masters Card Photo

on:
  push:
    paths:
      - '.github/workflows/patch-masters-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Masters image reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<img src="images/home-01.png" alt="Masters">'
          new = '<img src="images/masters-card.jpg" alt="Masters">'
          if old not in s:
              raise SystemExit('Masters image reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "TornadoesSynchroResources"
          git config user.email "jessicadancer83@gmail.com"
          git add index.html .github/workflows/patch-masters-photo.yml
          git rm .github/workflows/patch-masters-photo.yml
          git commit -m "Use new Masters group photo"
          git push
